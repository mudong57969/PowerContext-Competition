[project]
name = "exampilot-backend"
version = "0.1.0"
description = "ExamPilot AI Exam Coach backend (FastAPI + seekdb + PowerContext)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pymysql==1.2.0",
    "powercontext[client,server,seekdb]==1.2.0",
    "aiomysql==0.3.2",
    "pyobvector==0.2.28",
    "sqlalchemy==2.0.54",
    "pypdf>=5.0",
    "python-pptx>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "fastembed>=0.5",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
